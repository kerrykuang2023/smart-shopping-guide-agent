services:
  smart-guide-agent:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: smart-guide-agent
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DEMO_MODE: "${DEMO_MODE:-true}"
      VLM_PROVIDER: "${VLM_PROVIDER:-mock}"
      RECOGNITION_CONFIDENCE_THRESHOLD: "${RECOGNITION_CONFIDENCE_THRESHOLD:-0.6}"
      WORKSPACE_DIR: /app
      KNOWLEDGE_PRODUCTS_DIR: /app/knowledge/products
      IMAGE_DIR: /app/knowledge/images
    volumes:
      - ../../knowledge:/app/knowledge
      - ../../models:/app/models
      - ../../logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

